<!--
=============================================================
  ZINE GUESTBOOK — index.html
  Hosted on GitHub Pages | Backend: Supabase
=============================================================

  SETUP
  -----
  1. Find the two lines marked PASTE_YOUR_SUPABASE_URL and
     PASTE_YOUR_SUPABASE_ANON_KEY below and replace the
     placeholder strings with your actual values from:
     Supabase dashboard → Project Settings → API

  MANAGING ZINES
  --------------
  - To ADD a zine: insert a row in the `zines` table via the
    Supabase dashboard. Set `id` (e.g. "Korea1", "Korea2"),
    `title` (e.g. "Korea"), and `code` (e.g. "XK7Q" — print
    this inside the physical zine). Both copies of the same
    zine share the same title but have different IDs and codes.
  - To REMOVE a zine: delete its row from `zines`. All its
    comments will be deleted automatically (CASCADE).

  MANAGING COMMENTS
  -----------------
  - To DELETE a comment: find it in the `comments` table in
    the Supabase dashboard and delete its row.

  QR CODES
  --------
  - Each QR code should point to:
    https://YOUR_SITE/?zine=Korea1
    https://YOUR_SITE/?zine=Korea2  etc.
  - The zine ID in the URL must exactly match the `id` field
    in the `zines` table (case-sensitive).

  RATE LIMITING
  -------------
  - A client-side 60-second cooldown per browser session is
    enforced. Server-side rate limiting can be added in
    Supabase via a Postgres function if needed later.

=============================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zine Guestbook</title>
</head>
<body>

<h1>Zine Guestbook<br>小誌留言板</h1>
<p id="typewriter"></p>
<script>
  (function() {
    const lines = [
          ["Hello there. I hope you're having a great day my friend.", "哈囉～ 希望你今天過得愉快！"],
          ["My name is Xiao B Fan and I come from France.", "我叫小B飯，來自法國。"],
          ["I feel like sharing a glimpse of my life through those zines with you. If you'd like to leave a note, that would mean the world to me. Also, feel free to leave the zine you found somewhere else for someone to discover. I would love for them to travel the world!", "我想透過這些小誌和你分享我的旅遊。如果你願意留言給我，我會非常感激！另外，如果你願意的話，也可以把你找到的小誌留在別的地方讓其他人發現。我很希望它們能環遊世界！"],
          ["Merci!", "謝謝～"]
        ];
const el = document.getElementById("typewriter");
    let lineIndex = 0;
    let enIndex = 0;
    let zhIndex = 0;
    const speedEN = 30;
    const speedZH = 80;

    // completed lines
    let enDone = [];
    let zhDone = [];

    function render() {
      let enHtml = enDone.join("<br>") + (enDone.length ? "<br>" : "");
      let zhHtml = zhDone.join("<br>") + (zhDone.length ? "<br>" : "");
      if (lineIndex < lines.length) {
        enHtml += lines[lineIndex][0].slice(0, enIndex);
        zhHtml += lines[lineIndex][1].slice(0, zhIndex);
      }
      el.innerHTML = enHtml + '<span>|</span><br><br>' + zhHtml;
    }

    function typeEN() {
      if (lineIndex >= lines.length) return;
      if (enIndex < lines[lineIndex][0].length) {
        enIndex++;
        render();
        setTimeout(typeEN, speedEN);
      }
    }

    function typeZH() {
      if (lineIndex >= lines.length) return;
      if (zhIndex < lines[lineIndex][1].length) {
        zhIndex++;
        render();
        setTimeout(typeZH, speedZH);
      } else {
        // ZH finished this line — wait for EN then advance
        const enLen = lines[lineIndex][0].length;
        const remaining = (enLen - enIndex) * speedEN;
        setTimeout(function() {
          enDone.push(lines[lineIndex][0]);
          zhDone.push(lines[lineIndex][1]);
          lineIndex++;
          enIndex = 0;
          zhIndex = 0;
          if (lineIndex < lines.length) {
            setTimeout(function() { typeEN(); typeZH(); }, 300);
          } else {
            render();
          }
        }, remaining + 50);
      }
    }

    typeEN();
    typeZH();
      })();
</script>

<div id="status"></div>
<div id="comment-form-container"></div>
<hr>
<div id="zines-container">Loading...</div>

<script>
  // =============================================================
  //  CONFIG — paste your Supabase credentials here
  // =============================================================
  const SUPABASE_URL  = "https://bvppzhogumelrtdujxjp.supabase.co";   // e.g. https://xxxx.supabase.co 
  const SUPABASE_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2cHB6aG9ndW1lbHJ0ZHVqeGpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMTAzODIsImV4cCI6MjA5NTg4NjM4Mn0.BbmLgqDwwA1K7GSMAlLz2B4uT5s-OireLs_7i0m98RU";
  const MAX_COMMENT_LENGTH = 500;
  const RATE_LIMIT_MS = 60 * 1000; // 60 seconds between submissions

  // =============================================================
  //  HELPERS
  // =============================================================

  function supabaseHeaders() {
    return {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY
    };
  }

  async function supabaseFetch(path, options) {
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
      headers: supabaseHeaders(),
      ...options
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(err);
    }
    // 204 No Content (e.g. after INSERT with Prefer: return=minimal)
    if (res.status === 204) return null;
    return res.json();
  }

  function formatDate(isoString) {
      const d = new Date(isoString);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      const h = String(d.getHours()).padStart(2, "0");
      const min = String(d.getMinutes()).padStart(2, "0");
      return y + "/" + m + "/" + day + " " + h + ":" + min;
    }

  function getZineParam() {
    const params = new URLSearchParams(window.location.search);
    return params.get("zine");
  }

  // =============================================================
  //  FETCH DATA
  // =============================================================

  async function fetchZines() {
    return supabaseFetch("zines?select=*&order=created_at.asc");
  }

  async function fetchComments() {
    return supabaseFetch("comments?select=*&order=created_at.desc");
  }

  // =============================================================
  //  RENDER
  // =============================================================

  function renderCommentForm(zineId, zineTitle) {
    const container = document.getElementById("comment-form-container");

    container.innerHTML =
      "<form id='comment-form'>" +
        // Honeypot — hidden from real users, bots will fill it
        "<input type='text' id='honeypot' name='website' style='display:none' tabindex='-1' autocomplete='off'>" +

        "<label for='author'>Your name (optional):<br>你的名字（可選）:</label><br>" +
        "<input type='text' id='author' name='author' maxlength='80' autocomplete='off'><br><br>" +

        "<label for='location'>Where did you find the zine? (required):<br>你在哪里找到這本小誌？（必填）:</label><br>" +
        "<input type='text' id='location' name='location' maxlength='120' placeholder='e.g. Taipei, Fake Sober' required><br><br>" +

        "<label for='code'>Secret code printed at the back of the zine (required):<br>小誌背面的密碼（必填）:</label><br>" +
        "<input type='text' id='code' name='code' maxlength='20' required autocomplete='off' placeholder='e.g. XK7Q'><br><br>" +

        "<label for='body'>Message (required, max 500 chars):<br>留言（必填，最多500字）:</label><br>" +
        "<textarea id='body' name='body' rows='4' cols='40' maxlength='500' required></textarea><br>" +
        "<small id='char-count'>0 / 500</small><br><br>" +

        "<button type='submit'>Submit / 送出</button>" +
      "</form>" +
      "<div id='form-error'></div>";

    // Character counter
    document.getElementById("body").addEventListener("input", function() {
      document.getElementById("char-count").textContent = this.value.length + " / 500";
    });

    document.getElementById("comment-form").addEventListener("submit", function(e) {
      e.preventDefault();
      handleSubmit(zineId);
    });
  }

  function renderZines(zines, comments) {
    const container = document.getElementById("zines-container");

    if (!zines || zines.length === 0) {
      container.innerHTML = "<p>No zines found yet.<br>目前還沒有找到任何小誌。</p>";
      return;
    }

    // Group comments by zine_id
    const commentsByZine = {};
    comments.forEach(function(c) {
      if (!commentsByZine[c.zine_id]) commentsByZine[c.zine_id] = [];
      commentsByZine[c.zine_id].push(c);
    });

    // Group zines by title
    const zinesByTitle = {};
    const titleOrder = [];
    zines.forEach(function(z) {
      if (!zinesByTitle[z.title]) {
        zinesByTitle[z.title] = [];
        titleOrder.push(z.title);
      }
      zinesByTitle[z.title].push(z);
    });

    let html = "";

    titleOrder.forEach(function(title) {
      html += "<h2>" + escapeHtml(title) + "</h2>";

      const zineGroup = zinesByTitle[title];

      // Collect all comments for this title group, tagged with copy number
      let allComments = [];
      zineGroup.forEach(function(z) {
        const copyNumber = extractCopyNumber(z.id);
        const zineComments = commentsByZine[z.id] || [];
        zineComments.forEach(function(c) {
          allComments.push({ comment: c, copyNumber: copyNumber, zineId: z.id });
        });
      });

      // Sort by date descending
      allComments.sort(function(a, b) {
        return new Date(b.comment.created_at) - new Date(a.comment.created_at);
      });

      if (allComments.length === 0) {
        html += "<p><em>No comments yet for this zine.<br>這本小誌目前還沒有任何評論。</em></p>";
      } else {
        allComments.forEach(function(item) {
          const c = item.comment;
          html += "<p>";
          html += "<strong>" + escapeHtml(title) + " zine #" + item.copyNumber + "</strong><br>";
          html += "from / 來自: " + escapeHtml(c.author || "unknown / 不知名") + "<br>";
          if (c.location) html += "location / 地點: " + escapeHtml(c.location) + "<br>";
          html += formatDate(c.created_at) + "<br>";
          html += escapeHtml(c.body);          
          html += "</p><hr>";
        });
      }

      html += "<hr>";
    });

    container.innerHTML = html;
  }

  // =============================================================
  //  SUBMIT
  // =============================================================

  async function handleSubmit(zineId) {
    const errorEl = document.getElementById("form-error");
    errorEl.textContent = "";

    // Honeypot check
    if (document.getElementById("honeypot").value !== "") {
      return; // Silent fail for bots
    }

    // Rate limit check
    const lastSubmit = parseInt(sessionStorage.getItem("last_submit") || "0", 10);
    const now = Date.now();
    if (now - lastSubmit < RATE_LIMIT_MS) {
      const wait = Math.ceil((RATE_LIMIT_MS - (now - lastSubmit)) / 1000);
      errorEl.textContent = "Please wait " + wait + " more seconds before submitting again.";
      return;
    }

    const body = document.getElementById("body").value.trim();
    const code = document.getElementById("code").value.trim();
    const author = document.getElementById("author").value.trim();
    const location = document.getElementById("location").value.trim();

    if (!code) {
      errorEl.textContent = "Please enter the secret code printed at the back of the zine.<br>請輸入印在小誌背面的密碼。";
      return;
    }
    if (!body) {
      errorEl.textContent = "Message cannot be empty.<br>留言不能為空。";
      return;
    }
    if (body.length > MAX_COMMENT_LENGTH) {
      errorEl.textContent = "Message is too long.<br>留言太長了。";
      return;
    }

    const submitBtn = document.querySelector("#comment-form button[type='submit']");
    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";

    try {
      const result = await supabaseFetch("rpc/submit_comment", {
        method: "POST",
        body: JSON.stringify({
          p_zine_id: zineId,
          p_author: author || null,
          p_location: location || null,
          p_body: body,
          p_code: code
        })
      });

      if (result === "wrong_code") {
        errorEl.textContent = "Wrong code. Please check the secret code printed at the back of the zine. / 錯誤的代碼。請檢查印在小誌背面的密碼。";
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit / 送出";
        return;
      }

      if (result === "invalid_zine") {
        errorEl.textContent = "Unknown zine. Please try again. / 未知的小誌。請再試一次。";
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit / 送出";
        return;
      }

      sessionStorage.setItem("last_submit", String(Date.now()));

      // Redirect to homepage
      window.location.href = window.location.pathname;

    } catch (err) {
      errorEl.textContent = "Submission error. Please try again. / 提交錯誤。請再試一次。";
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit / 送出";
      console.error(err);
    }
  }

  // =============================================================
  //  UTILS
  // =============================================================

  function escapeHtml(str) {
    if (!str) return "";
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function extractCopyNumber(zineId) {
    // Extracts trailing number from e.g. "Korea3" → "3"
    const match = zineId.match(/(\d+)$/);
    return match ? match[1] : zineId;
  }

  // =============================================================
  //  INIT
  // =============================================================

  async function init() {
    const statusEl = document.getElementById("status");
    const zineParam = getZineParam();

    try {
      const [zines, comments] = await Promise.all([fetchZines(), fetchComments()]);

      if (zineParam) {
        const found = zines.find(function(z) { return z.id === zineParam; });
        if (found) {
          renderCommentForm(zineParam, found.title);
          const copyNumber = extractCopyNumber(zineParam);
          const totalCopies = zines.filter(function(z) { return z.title === found.title; }).length;
          const zineDisplay = "<em>" + escapeHtml(found.title) + "</em>";
          statusEl.innerHTML = "<h2>You scanned " + zineDisplay + ", leave a comment ♥️</h2>" +
            "<p>There are " + totalCopies + " copies in the world, and you found number " + copyNumber + ".<br>" +
            "你掃描了 " + zineDisplay + "，留言吧～<br>" +
            "這個小誌在世界上共有 " + totalCopies + " 本，你找到的是第 " + copyNumber + " 本。</p>";
          document.getElementById("zines-container").textContent = "";
          document.getElementById("comment-form-container").scrollIntoView({ behavior: "smooth" });
        } else {
          statusEl.innerHTML = "<p>Unknown zine ID: <strong>" + escapeHtml(zineParam) + "</strong>. Showing all comments below.</p>";
          renderZines(zines, comments);
        }
      } else {
        renderZines(zines, comments);
      }

    } catch (err) {
      statusEl.textContent = "Failed to load. Please try refreshing.";
      document.getElementById("zines-container").textContent = "";
      console.error(err);
    }
  }

  init();
</script>

</body>
</html>
