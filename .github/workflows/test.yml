name: Test comment flow

on:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Submit test comment
        id: submit
        run: |
          RESULT=$(curl -s -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/submit_comment" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "p_zine_id": "KoreaMoments1",
              "p_author": "CI Test",
              "p_location": "GitHub Actions",
              "p_body": "Automated test comment — will be deleted",
              "p_code": "${{ secrets.TEST_CODE }}",
              "p_instagram": "fake IG"
            }')
          echo "result=$RESULT" >> $GITHUB_OUTPUT
          if [ "$RESULT" != '"ok"' ]; then
            echo "❌ submit_comment returned: $RESULT"
            exit 1
          fi
          echo "✅ Comment submitted successfully"

      - name: Verify comment was inserted
        id: verify
        run: |
          COUNT=$(curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/comments?author=eq.CI%20Test&select=id" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            | python3 -c "import sys,json; data=json.load(sys.stdin); print(len(data))")
          if [ "$COUNT" -lt 1 ]; then
            echo "❌ Comment not found in database"
            exit 1
          fi
          echo "✅ Comment found in database ($COUNT row(s))"

      - name: Delete test comment
        run: |
            curl -s -X DELETE "${{ secrets.SUPABASE_URL }}/rest/v1/comments?author=eq.CI%20Test" \
                -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
                -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
                -H "Prefer: return=minimal"
            echo "✅ Test comment deleted"